name: Excavator (Auto-Update)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  excavate:
    name: Excavate & Auto-Update
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Excavate
        uses: ScoopInstaller/GithubActions@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_UPDATED: 1
